services:
  app-backend:
    image: ${APP_NAME}:${VERSION}
    ports:
      - "9000:9000"
    env_file:
      - ${BACKEND_ENV_FILE:-../.backendEnv} # 與 build.sh 一致
    networks:
      - app-network
    volumes:
      # Log
      - ./logs:/application/logs
      # Config
      - ./configs:/application/config
      # Env file for runtime lookup
      - ${BACKEND_ENV_FILE:-../.backendEnv}:/application/.backendEnv:ro
networks:
  app-network:
    driver: bridge
