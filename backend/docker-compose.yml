services:
  app-backend:
    image: ${APP_NAME}:${VERSION}
    ports:
      - "9000:9000"
    env_file:
      - ../.backendEnv # 與 build.sh 一致
    networks:
      - app-network
    volumes:
      # Log
      - ./logs:/application/logs
      # Config
      - ./configs:/application/config
      # Env: 掛載專案根目錄，程式讀取 /application/project-env/.backendEnv（避免 Windows 單檔掛載問題）
      - ..:/application/project-env:ro
networks:
  app-network:
    driver: bridge
